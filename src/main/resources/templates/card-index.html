<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Anki Trainer - Card Index</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="container mx-auto p-8 max-w-5xl" x-data="cardIndex()" x-init="init()">

  <!-- Шапка -->
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-4xl font-bold">Card Index</h1>
    <a :href="backUrl()"
       class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg text-sm transition">
      ← Back
    </a>
  </div>

  <div class="mb-4 flex items-center justify-between">
    <p class="text-gray-500" x-text="`${(page - 1) * limit + 1}–${Math.min(page * limit, total)} of ${total} cards`"></p>
    <div class="flex items-center gap-2">
      <label class="text-sm text-gray-500">Limit:</label>
      <input type="number" x-model.number="limit" min="1" max="100"
             class="w-20 border rounded px-2 py-1 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-300">
      <button @click="page = 1; totalPages = Math.ceil(total / limit); loadCards()"
              class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-1.5 px-4 rounded-lg text-sm transition">
        Refresh
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="text-center py-16">
    <p class="text-gray-500">Loading cards...</p>
  </div>

  <!-- Таблица -->
  <div x-show="!loading" class="bg-white border rounded-lg overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
      <tr class="bg-gray-50 border-b text-left text-gray-600">
        <th class="py-3 px-4 font-medium">Word</th>
        <th class="py-3 px-4 font-medium">Translation</th>
        <th class="py-3 px-4 font-medium">Conjugation</th>
        <th class="py-3 px-4 font-medium">Answer</th>
        <th class="py-3 px-4 font-medium">Due</th>
        <th class="py-3 px-4 font-medium">Status</th>
      </tr>
      </thead>
      <tbody>
      <template x-for="card in cards" :key="card.expectedAnswer + card.conjugationLabel">
        <tr class="border-b last:border-b-0" :class="rowClasses(card.color)">
          <td class="py-2 px-4 font-medium" x-text="card.word"></td>
          <td class="py-2 px-4 text-gray-600" x-text="card.translation"></td>
          <td class="py-2 px-4 text-gray-600" x-text="card.conjugationLabel"></td>
          <td class="py-2 px-4 text-gray-600" x-text="card.expectedAnswer"></td>
          <td class="py-2 px-4 text-gray-500" x-text="formatDue(card.due)"></td>
          <td class="py-2 px-4">
            <span class="text-gray-600" x-text="card.status"></span>
          </td>
        </tr>
      </template>
      </tbody>
    </table>

    <div x-show="!loading && cards.length === 0" class="text-center py-12">
      <p class="text-gray-500">No cards found.</p>
    </div>
  </div>

  <!-- Пагинация -->
  <div x-show="!loading && totalPages > 1"
       class="mt-4 flex items-center justify-center gap-3">
    <button @click="goToPage(page - 1)"
            :disabled="page <= 1"
            class="px-4 py-2 rounded-lg text-sm font-medium transition
                   bg-gray-200 hover:bg-gray-300 text-gray-700
                   disabled:opacity-40 disabled:cursor-not-allowed">
      ← Prev
    </button>
    <span class="text-sm text-gray-600" x-text="`Page ${page} / ${totalPages}`"></span>
    <button @click="goToPage(page + 1)"
            :disabled="page >= totalPages"
            class="px-4 py-2 rounded-lg text-sm font-medium transition
                   bg-gray-200 hover:bg-gray-300 text-gray-700
                   disabled:opacity-40 disabled:cursor-not-allowed">
      Next →
    </button>
  </div>
</div>

<script>
  function cardIndex() {
      return {
          cards: [],
          loading: true,
          source: 'queue',
          deckConfigId: null,
          partOfSpeech: '',
          conjugationType: '',
          conjugations: null,
          page: 1,
          limit: 10,
          total: 0,
          totalPages: 0,
          initialized: false,

          init() {
              if (this.initialized) return;
              this.initialized = true;

              const urlParams = new URLSearchParams(window.location.search);
              this.source = urlParams.get('source') || 'queue';
              this.deckConfigId = urlParams.get('deckId');
              this.partOfSpeech = urlParams.get('partOfSpeech') || '';
              this.conjugationType = urlParams.get('conjugationType') || '';
              this.conjugations = urlParams.get('conjugations');

              if (this.source === 'deck' && this.deckConfigId) {
                  fetch('/api/cards/deck/count?deckConfigId=' + encodeURIComponent(this.deckConfigId))
                      .then(r => r.json())
                      .then(total => {
                          this.total = total;
                          this.totalPages = Math.ceil(total / this.limit);
                          this.loadCards();
                      })
                      .catch(e => {
                          console.error('❌ Error loading card count:', e);
                          this.loadCards();
                      });
              } else if (this.source === 'queue') {
                  fetch('/api/session/queue/count')
                      .then(r => r.json())
                      .then(total => {
                          this.total = total;
                          this.totalPages = Math.ceil(total / this.limit);
                          this.loadCards();
                      })
                      .catch(e => {
                          console.error('❌ Error loading queue count:', e);
                          this.loadCards();
                      });
              } else {
                  this.loadCards();
              }
          },

          backUrl() {
              if (this.source === 'queue' && this.deckConfigId) {
                  const params = new URLSearchParams();
                  params.set('deckId', this.deckConfigId);
                  if (this.partOfSpeech) params.set('partOfSpeech', this.partOfSpeech);
                  if (this.conjugations) {
                      params.set('conjugations', this.conjugations);
                  } else if (this.conjugationType) {
                      params.set('conjugationType', this.conjugationType);
                  }
                  return '/session?' + params.toString();
              }
              return '/menu';
          },

          loadCards() {
              this.loading = true;

              if (this.source === 'deck') {
                  const params = new URLSearchParams();
                  params.set('deckConfigId', this.deckConfigId || '');
                  params.set('page', this.page);
                  params.set('limit', this.limit);

                  fetch('/api/cards/deck?' + params.toString())
                      .then(r => {
                          if (!r.ok) throw new Error('Failed to load cards');
                          return r.json();
                      })
                      .then(data => {
                          this.cards = data;
                          this.loading = false;
                      })
                      .catch(e => {
                          console.error('❌ Error loading cards:', e);
                          this.loading = false;
                      });
              } else {
                  const params = new URLSearchParams();
                  params.set('page', this.page);
                  params.set('limit', this.limit);

                  fetch('/api/session/queue?' + params.toString())
                      .then(r => {
                          if (!r.ok) throw new Error('Failed to load cards');
                          return r.json();
                      })
                      .then(data => {
                          this.cards = data;
                          this.loading = false;
                      })
                      .catch(e => {
                          console.error('❌ Error loading cards:', e);
                          this.loading = false;
                      });
              }
          },

          goToPage(p) {
              if (p < 1 || p > this.totalPages) return;
              this.page = p;
              this.loadCards();
          },

          formatDue(due) {
              if (!due) return '-';
              try {
                  return new Date(due).toLocaleString();
              } catch (e) {
                  return due;
              }
          },

          rowClasses(color) {
              switch (color) {
                  case 'blue': return 'bg-blue-50';
                  case 'red': return 'bg-red-50';
                  case 'green': return 'bg-green-50';
                  default: return '';
              }
          }
      }
  }
</script>
</body>
</html>
