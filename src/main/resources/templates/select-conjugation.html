<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Anki Trainer - Select Conjugation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="container mx-auto p-8 max-w-2xl" x-data="selectConjugation()" x-init="init()">

  <div class="flex justify-between items-center mb-8">
    <a href="#" @click.prevent="goBack()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg text-sm transition">
      ← Back
    </a>
    <h1 class="text-4xl font-bold">Anki Trainer</h1>
    <div class="w-20"></div>
  </div>

  <div class="text-center">
    <div x-show="loading" class="text-center py-8">
      <p class="text-gray-500">Loading...</p>
    </div>

    <div x-show="error" class="text-center py-8">
      <p class="text-red-600" x-text="error"></p>
      <button @click="loadConjugations()" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg text-sm">
        Retry
      </button>
    </div>

    <div x-show="!loading && !error">
      <div class="mb-4 text-left">
        <p class="text-sm text-gray-500">
          Deck: <span class="font-medium text-gray-700" x-text="deckName"></span>
        </p>
        <p class="text-sm text-gray-500">
          Language: <span class="font-medium text-gray-700" x-text="languageLabel"></span>
        </p>
        <p class="text-sm text-gray-500">
          Part of speech: <span class="font-medium text-gray-700" x-text="partOfSpeechLabel"></span>
        </p>
      </div>

      <h2 class="text-xl font-semibold mb-4">
        Select conjugation type for <span class="text-blue-600" x-text="partOfSpeechLabel"></span>:
      </h2>

      <div class="space-y-3">
        <template x-for="type in conjugationTypes" :key="type.key">
          <button @click="startTraining(type.key)"
                  class="block w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-lg text-lg transition">
            <span x-text="type.label"></span>
          </button>
        </template>
      </div>
    </div>
  </div>
</div>

<script>
  function selectConjugation() {
      return {
          deckId: null,
          deckName: '',
          languageKey: null,
          languageLabel: '',
          partOfSpeech: null,
          partOfSpeechLabel: '',
          conjugationTypes: [],
          loading: true,
          error: null,
          initialized: false,

          init() {
              if (this.initialized) return;
              this.initialized = true;
              const urlParams = new URLSearchParams(window.location.search);
              this.deckId = urlParams.get('deckId');
              this.languageKey = urlParams.get('language');
              this.partOfSpeech = urlParams.get('partOfSpeech');

              if (!this.deckId || !this.languageKey || !this.partOfSpeech) {
                  this.error = 'Missing parameters';
                  this.loading = false;
                  return;
              }

              this.loadConjugations();
          },

          loadConjugations() {
              this.loading = true;
              this.error = null;

              fetch(`/api/deck-config/${this.deckId}`)
                  .then(r => {
                      if (!r.ok) throw new Error('Failed to load deck info');
                      return r.json();
                  })
                  .then(data => {
                      this.deckName = data.deckName;
                  })
                  .catch(e => {
                      console.warn('Could not load deck name:', e);
                      this.deckName = `Deck #${this.deckId}`;
                  });

              fetch('/api/language/supported-languages')
                  .then(r => {
                      if (!r.ok) throw new Error('Failed to load languages');
                      return r.json();
                  })
                  .then(data => {
                      const found = data.find(l => l.key === this.languageKey);
                      this.languageLabel = found ? found.label : this.languageKey;
                  })
                  .catch(e => {
                      console.warn('Could not load language label:', e);
                      this.languageLabel = this.languageKey;
                  });

              fetch(`/api/language/supported-parts-of-speech?language=${this.languageKey}`)
                  .then(r => r.json())
                  .then(data => {
                      const found = data.find(p => p.key === this.partOfSpeech);
                      this.partOfSpeechLabel = found ? found.label : this.partOfSpeech;
                  })
                  .catch(e => {
                      console.warn('Could not load part of speech label:', e);
                      this.partOfSpeechLabel = this.partOfSpeech;
                  });

              fetch(`/api/language/supported-conjugations?language=${this.languageKey}&partOfSpeech=${this.partOfSpeech}`)
                  .then(r => {
                      if (!r.ok) throw new Error('Failed to load conjugation types');
                      return r.json();
                  })
                  .then(data => {
                      this.conjugationTypes = data;
                      this.loading = false;
                  })
                  .catch(e => {
                      this.error = 'Failed to load data: ' + e.message;
                      this.loading = false;
                  });
          },

          goBack() {
              window.location.href = `/select-part?deckId=${this.deckId}&language=${this.languageKey}`;
          },

          startTraining(conjugationType) {
              window.location.href = `/session?deckId=${this.deckId}&language=${this.languageKey}&partOfSpeech=${this.partOfSpeech}&conjugationType=${conjugationType}`;
          }
      }
  }
</script>
</body>
</html>
