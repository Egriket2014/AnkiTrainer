<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Anki Trainer - Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .translation-content ul {
        list-style-type: none !important;
        padding-left: 0 !important;
        margin: 0.5rem 0 !important;
        text-align: left !important;
    }
    .translation-content li {
        display: list-item !important;
        margin: 0.2rem 0 !important;
        text-align: left !important;
        padding-left: 0 !important;
    }
    .translation-content li::before {
        content: "• ";
        color: #6b7280;
        font-size: 1.2rem;
    }
    .translation-content ol {
        list-style-type: none !important;
        padding-left: 0 !important;
        margin: 0.5rem 0 !important;
        text-align: left !important;
        counter-reset: item;
    }
    .translation-content ol li {
        display: list-item !important;
        margin: 0.2rem 0 !important;
        text-align: left !important;
        padding-left: 0 !important;
    }
    .translation-content ol li::before {
        content: counter(item) ". ";
        counter-increment: item;
        color: #6b7280;
    }
    .translation-content div {
        text-align: left !important;
    }
  </style>
</head>
<body>
<div class="container mx-auto p-8 max-w-2xl" x-data="card()" x-init="init()">

  <!-- Header with Back only -->
  <div class="mb-8">
    <a href="#" @click.prevent="saveAndGoBack()"
       class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg text-sm transition inline-block">
      ← Back
    </a>
  </div>

  <!-- Loading state -->
  <div x-show="loading" class="text-center py-16">
    <p class="text-gray-500">Loading card...</p>
  </div>

  <!-- Card content -->
  <div x-show="!loading && !complete" class="max-w-lg mx-auto">
    <!-- Word -->
    <div class="text-center mb-6 mt-16">
      <p class="text-4xl font-bold" x-text="currentCard.word"></p>
    </div>

    <!-- Extra -->
    <div class="text-center mb-10">
      <p class="text-lg text-gray-500" x-text="currentCard.extra"></p>
    </div>

    <!-- Conjugation type -->
    <div class="text-center mb-2 text-sm text-gray-400">
      <span x-text="conjugationTypeLabel"></span>
    </div>

    <!-- Input -->
    <div class="mb-4">
      <input type="text"
             x-model="answer"
             id="answerInput"
             @keydown="if ($event.key === 'Enter') handleEnter()"
             class="w-full border-2 rounded-lg p-3 text-center text-xl focus:outline-none transition-colors duration-300"
             :class="{
                       'border-gray-300': !answered,
                       'border-green-500 bg-green-50': answered && isCorrect,
                       'border-red-500 bg-red-50': answered && !isCorrect
                   }"
             placeholder="Type answer..."
             :disabled="answered || complete">
    </div>

    <!-- Next hint (appears after answering) -->
    <div x-show="answered && !complete" class="text-center text-sm text-gray-500 mb-8">
      <span>Press </span>
      <a href="#" @click.prevent="nextCard()" class="text-blue-500 hover:underline font-medium">Next</a>
      <span> or Enter</span>
    </div>

    <!-- Show answer button (only before answering) -->
    <div x-show="!answered && !complete" class="text-center mt-4">
      <button @click="showAnswer()"
              class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-8 rounded-lg text-lg transition">
        Show answer
      </button>
    </div>

    <!-- Expected answer (shown after answering) -->
    <div x-show="answered" class="text-center mt-4 text-lg font-medium py-2">
      <span x-text="currentCard.expectedAnswer"></span>
    </div>

    <!-- Translation toggle -->
    <div class="mt-8">
      <button @click="showTranslation = !showTranslation"
              class="text-blue-500 hover:text-blue-700 text-sm font-medium transition flex items-center gap-1">
        <span x-show="showTranslation">▼</span>
        <span x-show="!showTranslation">▶</span>
        Translation
      </button>
      <div x-show="showTranslation" class="mt-1 translation-content">
        <div class="text-xl text-gray-600" x-html="currentCard.translation"></div>
      </div>
    </div>
  </div>

  <!-- Completion message -->
  <div x-show="complete" class="fixed inset-0 flex items-center justify-center z-50 pointer-events-none">
    <div class="text-center pointer-events-auto">
      <div class="text-6xl mb-4">🎉</div>
      <h2 class="text-3xl font-bold mb-2">Training complete!</h2>
      <p class="text-gray-600">You've finished all cards in this session.</p>
    </div>
  </div>
</div>

<script>
  window.handleEnterFromJava = function() {
      console.log('🔹 Enter from Java!');
      if (window.cardComponent && window.cardComponent.handleEnter) {
          window.cardComponent.handleEnter();
      }
  };

  function card() {
      return {
          currentCard: {
              word: '',
              extra: '',
              translation: '',
              expectedAnswer: '',
              noteId: null
          },
          answer: '',
          answered: false,
          isCorrect: false,
          showTranslation: true,
          loading: true,
          complete: false,

          partOfSpeech: '',
          conjugationType: '',
          conjugationTypeLabel: '',
          initialized: false,

          init() {
              if (this.initialized) return;
              this.initialized = true;

              console.log('🔹 Card initialized');
              window.cardComponent = this;

              const urlParams = new URLSearchParams(window.location.search);
              this.partOfSpeech = urlParams.get('partOfSpeech') || 'verb';
              this.conjugationType = urlParams.get('conjugationType') || 'past';

              const labels = {
                  'past': 'Past (た-form)',
                  'te': 'て-form',
                  'negative': 'Negative (ない-form)',
                  'polite': 'Polite (ます-form)',
                  'past_polite': 'Past Polite (ました-form)',
                  'negative_polite': 'Negative Polite (ません-form)',
                  'past_negative': 'Past Negative (なかった-form)',
                  'past_negative_polite': 'Past Negative Polite (ませんでした-form)'
              };
              this.conjugationTypeLabel = labels[this.conjugationType] || this.conjugationType;

              this.loadCurrentCard();
          },

          loadCurrentCard() {
              this.loading = true;

              fetch('/api/card/current')
                  .then(r => r.json())
                  .then(data => {
                      if (data.complete) {
                          this.complete = true;
                          this.loading = false;
                          return;
                      }

                      this.currentCard = data.card;
                      this.loading = false;
                      this.answer = '';
                      this.answered = false;
                      this.isCorrect = false;
                      console.log('✅ Card loaded:', this.currentCard);
                  })
                  .catch(e => {
                      console.error('❌ Error loading card:', e);
                      this.loading = false;
                  });
          },

          handleEnter() {
              console.log('🔹 handleEnter called');
              if (this.complete) return;

              if (!this.answered) {
                  this.checkAnswer();
              } else {
                  this.nextCard();
              }
          },

          checkAnswer() {
              if (this.answered || this.complete) return;

              const trimmedAnswer = this.answer.trim();

              const params = new URLSearchParams();
              params.append('answer', trimmedAnswer);

              fetch('/api/card/check', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/x-www-form-urlencoded'
                  },
                  body: params
              })
              .then(r => r.json())
              .then(data => {
                  this.isCorrect = data.correct;
                  this.answered = true;
                  console.log('✅ Check result:', data);
              })
              .catch(e => {
                  console.error('❌ Error checking answer:', e);
              });
          },

          loadNextCard() {
              this.loading = true;

              fetch('/api/card/current')
                  .then(r => r.json())
                  .then(data => {
                      if (data.complete) {
                          this.complete = true;
                          this.loading = false;
                          return;
                      }

                      this.currentCard = data.card;
                      this.loading = false;
                      this.answer = '';
                      this.answered = false;
                      this.isCorrect = false;
                      console.log('✅ Next card loaded:', this.currentCard);
                  })
                  .catch(e => {
                      console.error('❌ Error loading next card:', e);
                      this.loading = false;
                  });
          },

          showAnswer() {
              if (this.answered || this.complete) return;
              this.answer = '';
              this.checkAnswer();
          },

          nextCard() {
              if (this.complete) return;
              this.loadNextCard();
          },

          saveAndGoBack() {
              fetch('/api/card/save', {
                  method: 'POST'
              })
              .then(() => {
                  window.location.href = '/menu';
              })
              .catch(e => {
                  console.error('❌ Error saving results:', e);
                  window.location.href = '/menu';
              });
          }
      }
  }
</script>
</body>
</html>
