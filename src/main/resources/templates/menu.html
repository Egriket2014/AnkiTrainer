<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Anki Trainer - My Decks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body>
<div class="container mx-auto p-8 max-w-2xl" x-data="menu()" x-init="init()">

    <!-- Шапка -->
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold">Anki Trainer</h1>
        <div class="flex gap-2">
            <a href="/settings"
               class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg text-sm transition flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Settings
            </a>
            <a href="/config/new"
               class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg text-sm transition flex items-center gap-1">
                <span class="text-lg font-bold">+</span> Add Deck
            </a>
        </div>
    </div>

    <!-- Контент -->
    <div class="text-center">
        <!-- Loading -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-500">Loading your decks...</p>
        </div>

        <!-- Error -->
        <div x-show="error" class="text-center py-8">
            <p class="text-red-600" x-text="error"></p>
            <button @click="loadDecks()" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg text-sm">
                Retry
            </button>
        </div>

        <!-- Список колод -->
        <div x-show="!loading && !error">
            <!-- Пустое состояние -->
            <div x-show="decks.length === 0" class="text-center py-16">
                <div class="text-6xl mb-4">📚</div>
                <p class="text-gray-500 text-lg">No decks added yet.</p>
                <p class="text-gray-400 text-sm">Click "Add Deck" to get started!</p>
            </div>

            <!-- Список -->
            <div class="space-y-3">
                <template x-for="deck in decks" :key="deck.id">
                    <div class="flex justify-between items-center bg-white border rounded-lg p-4 shadow-sm hover:shadow-md transition cursor-pointer"
                         @click="selectDeck(deck)">

                        <!-- Название колоды -->
                        <div class="flex-1 text-left">
                            <span class="font-medium text-lg" x-text="deck.deckName"></span>
                        </div>

                        <!-- Кнопки действий -->
                        <div class="flex items-center gap-2">
                            <a :href="'/card-index?source=deck&deckId=' + deck.id"
                               @click.stop
                               title="Cards"
                               class="bg-purple-100 hover:bg-purple-200 text-purple-700 p-2 rounded-lg transition inline-flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                                </svg>
                            </a>
                            <button @click.stop="syncCards(deck)"
                                    :disabled="deck._syncing"
                                    title="Sync"
                                    class="bg-green-100 hover:bg-green-200 text-green-700 p-2 rounded-lg transition cursor-pointer inline-flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     :class="deck._syncing ? 'animate-spin' : ''"
                                     class="h-4 w-4"
                                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                </svg>
                            </button>
                            <a :href="'/config/' + deck.id"
                               @click.stop
                               title="Settings"
                               class="bg-gray-200 hover:bg-gray-300 text-gray-700 p-2 rounded-lg transition inline-flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Toast синхронизации -->
    <div x-show="syncResult"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-4"
         class="fixed bottom-6 right-6 z-50 bg-white rounded-xl shadow-2xl border border-gray-200 p-5 w-64"
         x-cloak>
        <div class="flex items-center justify-between mb-3">
            <p class="font-bold text-gray-800">Sync complete</p>
            <button @click="syncResult = null"
                    class="text-gray-400 hover:text-gray-600 text-xl leading-none ml-4">&times;</button>
        </div>

        <div class="space-y-1.5 text-sm">
            <div class="flex items-center justify-between">
                <span class="text-blue-600 font-medium">Created</span>
                <span class="text-blue-700 font-bold" x-text="syncResult ? syncResult.created : 0"></span>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-green-600 font-medium">Updated</span>
                <span class="text-green-700 font-bold" x-text="syncResult ? syncResult.updated : 0"></span>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-red-600 font-medium">Deleted</span>
                <span class="text-red-700 font-bold" x-text="syncResult ? syncResult.deleted : 0"></span>
            </div>
        </div>
    </div>
</div>

<script>
    function menu() {
        return {
            loading: true,
            error: null,
            decks: [],
            syncResult: null,
            initialized: false,

            init() {
                if (this.initialized) return;
                this.initialized = true;
                this.loadDecks();
            },

            loadDecks() {
                this.loading = true;
                this.error = null;

                fetch('/api/deck-config')
                    .then(r => {
                        if (!r.ok) throw new Error(`Failed to load decks (${r.status})`);
                        return r.json();
                    })
                    .then(data => {
                        this.decks = data.map(d => ({...d, _syncing: false}));
                        this.loading = false;
                    })
                    .catch(e => {
                        this.error = e.message;
                        this.loading = false;
                    });
            },

            selectDeck(deck) {
                window.location.href = `/select-training?deckId=${deck.id}&language=${deck.language}`;
            },

            syncCards(deck) {
                deck._syncing = true;
                fetch(`/api/deck/sync?deckConfigId=${deck.id}`, { method: 'POST' })
                    .then(r => {
                        if (!r.ok) throw new Error('Sync failed');
                        return r.json();
                    })
                    .then(data => {
                        deck._syncing = false;
                        this.showSyncToast(data);
                    })
                    .catch(e => {
                        console.error('❌ Sync error:', e);
                        deck._syncing = false;
                        alert('Sync failed: ' + e.message);
                    });
            },

            showSyncToast(data) {
                clearTimeout(this._syncTimer);
                this.syncResult = data;
                this._syncTimer = setTimeout(() => {
                    this.syncResult = null;
                }, 4000);
            }
        }
    }
</script>
</body>
</html>
