<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Anki Trainer - My Decks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="container mx-auto p-8 max-w-2xl" x-data="menu()" x-init="init()">

    <!-- Шапка -->
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold">Anki Trainer</h1>
        <div class="flex gap-2">
            <a href="/settings"
               class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg text-sm transition flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Settings
            </a>
            <a href="/config/new"
               class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg text-sm transition flex items-center gap-1">
                <span class="text-lg font-bold">+</span> Add Deck
            </a>
        </div>
    </div>

    <!-- Контент -->
    <div class="text-center">
        <!-- Loading -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-500">Loading your decks...</p>
        </div>

        <!-- Error -->
        <div x-show="error" class="text-center py-8">
            <p class="text-red-600" x-text="error"></p>
            <button @click="loadDecks()" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg text-sm">
                Retry
            </button>
        </div>

        <!-- Список колод -->
        <div x-show="!loading && !error">
            <!-- Пустое состояние -->
            <div x-show="decks.length === 0" class="text-center py-16">
                <div class="text-6xl mb-4">📚</div>
                <p class="text-gray-500 text-lg">No decks added yet.</p>
                <p class="text-gray-400 text-sm">Click "Add Deck" to get started!</p>
            </div>

            <!-- Список -->
            <div class="space-y-3">
                <template x-for="deck in decks" :key="deck.id">
                    <div class="flex justify-between items-center bg-white border rounded-lg p-4 shadow-sm hover:shadow-md transition cursor-pointer"
                         @click="selectDeck(deck)">

                        <!-- Название колоды -->
                        <div class="flex-1 text-left">
                            <span class="font-medium text-lg" x-text="deck.deckName"></span>
                        </div>

                        <!-- Кнопка настроек с SVG-иконкой -->
                        <a :href="'/config/' + deck.id"
                           @click.stop
                           class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-1.5 px-4 rounded-lg text-sm transition flex items-center gap-1.5">
                            <!-- SVG-иконка шестерёнки (Heroicons) -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            Settings
                        </a>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
    function menu() {
        return {
            loading: true,
            error: null,
            decks: [],
            initialized: false,

            init() {
                if (this.initialized) return;
                this.initialized = true;
                this.loadDecks();
            },

            loadDecks() {
                this.loading = true;
                this.error = null;

                fetch('/api/deck-config')
                    .then(r => {
                        if (!r.ok) throw new Error(`Failed to load decks (${r.status})`);
                        return r.json();
                    })
                    .then(data => {
                        this.decks = data;
                        this.loading = false;
                    })
                    .catch(e => {
                        this.error = e.message;
                        this.loading = false;
                    });
            },

            selectDeck(deck) {
                window.location.href = `/select-part?deckId=${deck.id}&language=${deck.language}`;
            }
        }
    }
</script>
</body>
</html>
