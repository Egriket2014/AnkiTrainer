<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Anki Trainer - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="container mx-auto p-8 max-w-2xl" x-data="menu()" x-init="init()">
    <!-- Шапка с Back (условно), заголовком по центру и Settings справа -->
    <div class="relative flex justify-center items-center mb-8">
        <button x-show="selectedPart !== null"
                @click="selectedPart = null"
                class="absolute left-0 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg text-sm transition">
            ← Back
        </button>
        <h1 class="text-4xl font-bold">Anki Trainer</h1>
        <a href="/config"
           class="absolute right-0 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg text-sm transition">
            Settings
        </a>
    </div>

    <div class="text-center">
        <!-- Loading -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-500">Loading...</p>
        </div>

        <!-- Error -->
        <div x-show="error" class="text-center py-8">
            <p class="text-red-600" x-text="error"></p>
            <a href="/config" class="text-blue-500 hover:underline">Go to settings</a>
        </div>

        <!-- Выбор части речи -->
        <div x-show="!loading && !error && selectedPart === null">
            <h2 class="text-xl font-semibold mb-4">Select part of speech:</h2>
            <div class="space-y-3">
                <template x-for="part in partsOfSpeech" :key="part.key">
                    <button @click="selectPart(part.key)"
                            class="block w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-lg text-xl transition">
                        <span x-text="part.label"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Выбор типа спряжения -->
        <div x-show="!loading && !error && selectedPart !== null">
            <h2 class="text-xl font-semibold mb-4">
                Select conjugation type for <span x-text="selectedPartLabel"></span>:
            </h2>
            <div class="space-y-3">
                <template x-for="type in conjugationTypes" :key="type.key">
                    <button @click="startTraining(selectedPart, type.key)"
                            class="block w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-lg text-lg transition">
                        <span x-text="type.label"></span>
                    </button>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
    function menu() {
        return {
            loading: true,
            error: null,
            partsOfSpeech: [],
            selectedPart: null,
            selectedPartLabel: '',
            conjugationTypes: [],
            initialized: false,

            init() {
                if (this.initialized) return;
                this.initialized = true;

                fetch('/api/menu/parts-of-speech')
                    .then(r => {
                        if (!r.ok) throw new Error('Failed to load parts of speech');
                        return r.json();
                    })
                    .then(data => {
                        this.partsOfSpeech = data;
                        this.loading = false;
                        console.log('✅ Parts of speech loaded:', data);
                    })
                    .catch(e => {
                        console.error('❌ Error:', e);
                        this.error = 'Failed to load data. Please check your settings.';
                        this.loading = false;
                    });
            },

            selectPart(partKey) {
                this.selectedPart = partKey;
                const part = this.partsOfSpeech.find(p => p.key === partKey);
                this.selectedPartLabel = part ? part.label : '';

                this.conjugationTypes = [];

                fetch(`/api/menu/conjugation-types?partOfSpeech=${partKey}`)
                    .then(r => {
                        if (!r.ok) throw new Error('Failed to load conjugation types');
                        return r.json();
                    })
                    .then(data => {
                        this.conjugationTypes = data;
                        console.log('✅ Conjugation types loaded:', data);
                    })
                    .catch(e => {
                        console.error('❌ Error loading conjugation types:', e);
                        this.conjugationTypes = [];
                    });
            },

            startTraining(partOfSpeech, conjugationType) {
                fetch('/api/card/prepare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        partOfSpeech: partOfSpeech,
                        conjugationType: conjugationType
                    })
                })
                .then(r => r.json())
                .then(data => {
                    if (!data.success) {
                        alert('Error: ' + (data.error || 'Failed to prepare cards'));
                        return;
                    }
                    window.location.href = `/card?partOfSpeech=${partOfSpeech}&conjugationType=${conjugationType}`;
                })
                .catch(e => {
                    console.error('❌ Error preparing cards:', e);
                    alert('Failed to start training. Please check your settings.');
                });
            }
        }
    }
</script>
</body>
</html>
