<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Anki Trainer - Меню</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="container mx-auto p-8 max-w-2xl">
    <div class="text-center">
        <h1 class="text-4xl font-bold mb-4">📚 Anki Trainer</h1>
        <p class="text-gray-600 mb-8">Тренажёр спряжения японских глаголов</p>

        <div class="space-y-4">
            <a href="/trainer"
               class="block w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-lg text-xl transition">
                ▶️ Начать тренировку
            </a>

            <a href="/config"
               class="block w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg text-lg transition">
                ⚙️ Настройки
            </a>
        </div>

        <div class="mt-12 text-sm text-gray-400 border-t pt-4">
            <p>Выберите "Начать тренировку", чтобы перейти к карточкам с глаголами.</p>
            <p>Настройки позволяют изменить колоду, модель или поля.</p>
        </div>
    </div>
</div>
</body>
</html>
