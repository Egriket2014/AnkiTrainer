<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Anki Trainer - Тренировка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="container mx-auto p-8"
     x-data="trainer(
         /*[[${config.defaultDeck}]]*/ '',
         /*[[${config.defaultModel}]]*/ '',
         /*[[${config.wordField}]]*/ '',
         /*[[${config.translationField}]]*/ '',
         /*[[${config.extraField}]]*/ ''
     )"
     x-init="init()">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">📖 Карточки с глаголами</h1>
        <a href="/menu" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded">
            ← Назад в меню
        </a>
    </div>

    <div x-show="loading" class="text-center py-8">
        <p class="text-gray-500">Загрузка карточек...</p>
    </div>

    <div x-show="cards.length > 0" class="mt-4">
        <p class="text-sm text-gray-500 mb-4">Найдено глаголов: <span x-text="cards.length"></span></p>
        <table class="table-auto border-collapse border border-gray-400 w-full">
            <thead>
            <tr>
                <th class="border border-gray-300 px-4 py-2">Слово</th>
                <th class="border border-gray-300 px-4 py-2">Перевод</th>
                <th class="border border-gray-300 px-4 py-2">Доп. поле</th>
            </tr>
            </thead>
            <tbody>
            <template x-for="card in cards" :key="card.noteId">
                <tr>
                    <td class="border border-gray-300 px-4 py-2" x-text="card.word"></td>
                    <td class="border border-gray-300 px-4 py-2" x-html="card.translation"></td>
                    <td class="border border-gray-300 px-4 py-2" x-text="card.extra"></td>
                </tr>
            </template>
            </tbody>
        </table>
    </div>

    <div x-show="!loading && cards.length === 0" class="text-center py-8">
        <p class="text-yellow-600">Глаголы не найдены. Проверьте настройки.</p>
        <a href="/config" class="text-blue-500 hover:underline">Перейти к настройкам</a>
    </div>
</div>

<script>
    function trainer(defaultDeck, defaultModel, wordField, translationField, extraField) {
        return {
            selectedDeck: defaultDeck,
            selectedModel: defaultModel,
            wordField: wordField,
            translationField: translationField,
            extraField: extraField,
            cards: [],
            loading: true,

            init() {
                if (this.selectedDeck && this.selectedModel && this.wordField && this.translationField) {
                    this.loadCards();
                } else {
                    this.loading = false;
                }
            },

            loadCards() {
                this.loading = true;
                const payload = new URLSearchParams({
                    deckName: this.selectedDeck,
                    modelName: this.selectedModel,
                    wordField: this.wordField,
                    translationField: this.translationField,
                    extraField: this.extraField || ''
                });

                fetch('/api/cards/verbs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload
                })
                .then(r => r.json())
                .then(data => {
                    this.cards = data;
                    this.loading = false;
                    console.log('✅ Карточки загружены:', this.cards);
                })
                .catch(e => {
                    console.error('❌ Ошибка:', e);
                    this.loading = false;
                    alert('Ошибка загрузки карточек');
                });
            }
        }
    }
</script>
</body>
</html>
