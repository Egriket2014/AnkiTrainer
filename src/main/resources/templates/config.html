<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:x-bind="http://www.w3.org/1999/xhtml">
<head>
    <title>Anki Trainer - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="container mx-auto p-8" x-data="config()" x-init="init()">

    <h1 class="text-2xl font-bold mb-6">Settings</h1>

    <div class="border p-4 rounded mb-6">
        <!-- 0. Language -->
        <div class="mb-4">
            <label class="block font-bold mb-1">Language:</label>
            <select x-model="selectedLanguage" class="border p-2 w-64 rounded">
                <option value="japanese">Japanese</option>
            </select>
        </div>

        <!-- 1. Deck -->
        <div class="mb-4">
            <label class="block font-bold mb-1">Deck:</label>
            <select x-model="selectedDeck" @change="onDeckChange()" class="border p-2 w-64 rounded">
                <option value="">-- Select deck --</option>
                <template x-for="deck in decks" :key="deck">
                    <option x-bind:value="deck" x-text="deck"
                            x-bind:selected="deck === selectedDeck"></option>
                </template>
            </select>
        </div>

        <!-- 2. Note type (Model) -->
        <div class="mb-4">
            <label class="block font-bold mb-1">Note type (Model):</label>
            <select x-model="selectedModel" @change="onModelChange()" class="border p-2 w-64 rounded" :disabled="!selectedDeck">
                <option value="">-- Select model --</option>
                <template x-for="model in allModels" :key="model">
                    <option x-bind:value="model" x-text="model"
                            x-bind:selected="model === selectedModel"></option>
                </template>
            </select>
        </div>

        <!-- 3. Fields -->
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div>
                <label class="block font-bold mb-1">Word field:</label>
                <select x-model="wordField" class="border p-2 w-full rounded" :disabled="!selectedModel">
                    <option value="">-- Select field --</option>
                    <template x-for="field in fields" :key="field">
                        <option x-bind:value="field" x-text="field"
                                x-bind:selected="field === wordField"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block font-bold mb-1">Translation field:</label>
                <select x-model="translationField" class="border p-2 w-full rounded" :disabled="!selectedModel">
                    <option value="">-- Select field --</option>
                    <template x-for="field in fields" :key="field">
                        <option x-bind:value="field" x-text="field"
                                x-bind:selected="field === translationField"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block font-bold mb-1">Extra field (optional):</label>
                <select x-model="extraField" class="border p-2 w-full rounded" :disabled="!selectedModel">
                    <option value="">-- None --</option>
                    <template x-for="field in fields" :key="field">
                        <option x-bind:value="field" x-text="field"
                                x-bind:selected="field === extraField"></option>
                    </template>
                </select>
            </div>
        </div>

        <!-- 4. Cards per session -->
        <div class="mb-4">
            <label class="block font-bold mb-1">Cards per session:</label>
            <input type="number" x-model="sessionCardsLimit" min="1" max="100"
                   class="border p-2 w-32 rounded">
        </div>

        <!-- 5. hasSavedConfig (hidden, for logic only) -->
        <div class="hidden">
            <span x-text="hasSavedConfig"></span>
        </div>

        <div class="flex gap-2">
            <button @click="saveConfig()"
                    class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 disabled:opacity-50"
                    :disabled="!isConfigComplete()">
                Save & go to menu
            </button>
            <a href="/menu"
               class="bg-gray-300 text-gray-800 px-4 py-2 rounded"
               :class="{'opacity-50 pointer-events-none': !hasSavedConfig, 'hover:bg-gray-400': hasSavedConfig}">
                Back
            </a>
        </div>
    </div>
</div>

<script>
    function config() {
        return {
            // Current values
            selectedDeck: '',
            selectedModel: '',
            wordField: '',
            translationField: '',
            extraField: '',
            sessionCardsLimit: 10,
            selectedLanguage: 'japanese',

            // Data from server
            decks: [],
            allModels: [],
            fields: [],

            // State
            hasSavedConfig: false,
            loading: true,
            initialized: false,

            init() {
                if (this.initialized) return;
                this.initialized = true;

                // 1. Load decks and models
                this.loadDecksAndModels();

                // 2. Load current config
                this.loadCurrentConfig();
            },

            loadDecksAndModels() {
                Promise.all([
                    fetch('/api/config/decks').then(r => r.json()),
                    fetch('/api/config/models').then(r => r.json())
                ])
                .then(([decks, models]) => {
                    this.decks = decks;
                    this.allModels = models;
                    console.log('✅ Decks and models loaded');
                })
                .catch(e => console.error('❌ Error loading data:', e));
            },

            loadCurrentConfig() {
                fetch('/api/config/current')
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.deck) {
                            this.selectedDeck = data.deck;
                            this.selectedModel = data.model || '';
                            this.wordField = data.wordField || '';
                            this.translationField = data.translationField || '';
                            this.extraField = data.extraField || '';
                            this.sessionCardsLimit = data.sessionCardsLimit || 10;
                            this.selectedLanguage = data.language || 'japanese';
                            this.hasSavedConfig = true;

                            // If model is selected, load its fields
                            if (this.selectedModel) {
                                this.loadFields();
                            }
                        }
                        console.log('✅ Config loaded:', data);
                    })
                    .catch(e => console.error('❌ Error loading config:', e));
            },

            loadFields() {
                if (!this.selectedModel) {
                    this.fields = [];
                    return;
                }

                fetch(`/api/config/fields?modelName=${encodeURIComponent(this.selectedModel)}`)
                    .then(r => r.json())
                    .then(data => {
                        this.fields = data;
                        console.log('✅ Fields loaded for model:', this.selectedModel);
                    })
                    .catch(e => console.error('❌ Error loading fields:', e));
            },

            isConfigComplete() {
                return this.selectedDeck && this.selectedModel && this.wordField && this.translationField;
            },

            onDeckChange() {
                this.selectedModel = '';
                this.wordField = '';
                this.translationField = '';
                this.extraField = '';
                this.fields = [];
            },

            onModelChange() {
                this.wordField = '';
                this.translationField = '';
                this.extraField = '';
                this.loadFields();
            },

            saveConfig() {
                if (!this.isConfigComplete()) {
                    alert('Please fill in all required fields!');
                    return;
                }

                const payload = {
                    deck: this.selectedDeck,
                    model: this.selectedModel,
                    wordField: this.wordField,
                    translationField: this.translationField,
                    extraField: this.extraField,
                    sessionCardsLimit: parseInt(this.sessionCardsLimit) || 10,
                    language: this.selectedLanguage
                };

                fetch('/api/config/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(r => r.json())
                .then(() => {
                    this.hasSavedConfig = true;
                    window.location.href = '/menu';
                })
                .catch(e => {
                    alert('Error saving settings');
                    console.error('❌ Error:', e);
                });
            }
        }
    }
</script>
</body>
</html>
