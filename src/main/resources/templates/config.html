<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:x-bind="http://www.w3.org/1999/xhtml">
<head>
    <title>Anki Trainer - Настройки</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="container mx-auto p-8"
     x-data="config(
         $el.dataset.defaultDeck,
         $el.dataset.defaultModel,
         $el.dataset.defaultWordField,
         $el.dataset.defaultTranslationField,
         $el.dataset.defaultExtraField
     )"
     th:attr="data-default-deck=${config != null ? config.defaultDeck : ''},
              data-default-model=${config != null ? config.defaultModel : ''},
              data-default-word-field=${config != null ? config.wordField : ''},
              data-default-translation-field=${config != null ? config.translationField : ''},
              data-default-extra-field=${config != null ? config.extraField : ''}"
     x-init="init()">

    <h1 class="text-2xl font-bold mb-6">⚙️ Настройки тренажёра</h1>

    <div class="border p-4 rounded mb-6">
        <div class="mb-4">
            <label class="block font-bold mb-1">1. Колода:</label>
            <select x-model="selectedDeck" @change="onDeckChange()" class="border p-2 w-64 rounded">
                <option value="">-- Выберите колоду --</option>
                <template x-for="deck in decks" :key="deck">
                    <option x-bind:value="deck" x-text="deck"
                            x-bind:selected="deck === selectedDeck"></option>
                </template>
            </select>
        </div>

        <div class="mb-4">
            <label class="block font-bold mb-1">2. Тип карточки (Model):</label>
            <select x-model="selectedModel" @change="onModelChange()" class="border p-2 w-64 rounded" :disabled="!selectedDeck">
                <option value="">-- Выберите модель --</option>
                <template x-for="model in allModels" :key="model">
                    <option x-bind:value="model" x-text="model"
                            x-bind:selected="model === selectedModel"></option>
                </template>
            </select>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-6">
            <div>
                <label class="block font-bold mb-1">3a. Поле Слова:</label>
                <select x-model="wordField" class="border p-2 w-full rounded" :disabled="!selectedModel">
                    <option value="">-- Выберите поле --</option>
                    <template x-for="field in fields" :key="field">
                        <option x-bind:value="field" x-text="field"
                                x-bind:selected="field === wordField"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block font-bold mb-1">3b. Поле Перевода:</label>
                <select x-model="translationField" class="border p-2 w-full rounded" :disabled="!selectedModel">
                    <option value="">-- Выберите поле --</option>
                    <template x-for="field in fields" :key="field">
                        <option x-bind:value="field" x-text="field"
                                x-bind:selected="field === translationField"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block font-bold mb-1">3c. Доп. поле (опц.):</label>
                <select x-model="extraField" class="border p-2 w-full rounded" :disabled="!selectedModel">
                    <option value="">-- Нет --</option>
                    <template x-for="field in fields" :key="field">
                        <option x-bind:value="field" x-text="field"
                                x-bind:selected="field === extraField"></option>
                    </template>
                </select>
            </div>
        </div>

        <div class="flex gap-2">
            <button @click="saveConfig()"
                    class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 disabled:opacity-50"
                    :disabled="!isConfigComplete()">
                💾 Сохранить и перейти в меню
            </button>
            <a href="/menu" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">
                Отмена
            </a>
        </div>
    </div>
</div>

<script>
    function config(
        defaultDeck = '',
        defaultModel = '',
        defaultWordField = '',
        defaultTranslationField = '',
        defaultExtraField = ''
    ) {
        return {
            // Флаг для предотвращения двойной инициализации
            initialized: false,

            // Значения из сохранённой конфигурации
            defaultDeck: defaultDeck,
            defaultModel: defaultModel,
            defaultWordField: defaultWordField,
            defaultTranslationField: defaultTranslationField,
            defaultExtraField: defaultExtraField,

            // Текущие выбранные значения
            selectedDeck: defaultDeck,
            selectedModel: defaultModel,
            wordField: defaultWordField,
            translationField: defaultTranslationField,
            extraField: defaultExtraField,

            // Данные из Anki
            decks: [],
            allModels: [],
            fields: [],

            init() {
                // Защита от двойной инициализации
                if (this.initialized) {
                    console.log('⚠️ Конфигурация уже инициализирована, пропускаем');
                    return;
                }
                this.initialized = true;

                console.log('🔹 Config page initialized');
                console.log('🔹 Default values:', {
                    defaultDeck: this.defaultDeck,
                    defaultModel: this.defaultModel,
                    defaultWordField: this.defaultWordField,
                    defaultTranslationField: this.defaultTranslationField,
                    defaultExtraField: this.defaultExtraField
                });

                // Загружаем колоды и модели
                this.loadDecksAndModels();

                // Если есть сохранённая модель — загружаем поля
                if (this.selectedModel) {
                    this.loadFields();
                }
            },

            loadDecksAndModels() {
                fetch('/api/decks')
                    .then(r => r.json())
                    .then(data => {
                        this.decks = data;
                        console.log('✅ Колоды загружены:', this.decks);
                    })
                    .catch(e => console.error('❌ Ошибка загрузки колод:', e));

                fetch('/api/models')
                    .then(r => r.json())
                    .then(data => {
                        this.allModels = data;
                        console.log('✅ Модели загружены:', this.allModels);
                    })
                    .catch(e => console.error('❌ Ошибка загрузки моделей:', e));
            },

            loadFields() {
                if (!this.selectedModel) {
                    this.fields = [];
                    return;
                }

                fetch(`/api/fields?modelName=${encodeURIComponent(this.selectedModel)}`)
                    .then(r => r.json())
                    .then(data => {
                        this.fields = data;
                        console.log('✅ Поля загружены для модели:', this.selectedModel, this.fields);
                    })
                    .catch(e => console.error('❌ Ошибка загрузки полей:', e));
            },

            isConfigComplete() {
                return this.selectedDeck && this.selectedModel && this.wordField && this.translationField;
            },

            onDeckChange() {
                this.selectedModel = '';
                this.wordField = '';
                this.translationField = '';
                this.extraField = '';
                this.fields = [];
            },

            onModelChange() {
                this.wordField = '';
                this.translationField = '';
                this.extraField = '';
                this.loadFields();
            },

            saveConfig() {
                if (!this.isConfigComplete()) {
                    alert('Пожалуйста, заполните все обязательные поля!');
                    return;
                }

                const payload = {
                    defaultDeck: this.selectedDeck,
                    defaultModel: this.selectedModel,
                    wordField: this.wordField,
                    translationField: this.translationField,
                    extraField: this.extraField
                };

                fetch('/api/config/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(r => r.json())
                .then(() => {
                    window.location.href = '/menu';
                })
                .catch(e => {
                    alert('Ошибка сохранения настроек');
                    console.error('❌ Ошибка:', e);
                });
            }
        }
    }
</script>
</body>
</html>
